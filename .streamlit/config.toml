[theme]
base = "light"
primaryColor = "#3f7d6a"
backgroundColor = "#fbfaf6"
secondaryBackgroundColor = "#eef4f1"
textColor = "#26302d"
font = "sans serif"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
# Hides Streamlit's Deploy button and the ⋮ menu. Remove this line (or set "auto") to bring them back.
toolbarMode = "minimal"
